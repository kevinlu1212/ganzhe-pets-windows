name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify pinned assets
        shell: powershell
        run: ./scripts/build.ps1
      - name: Package code and installer without original media
        shell: powershell
        run: ./scripts/package.ps1 -Version 1.0.0
      - name: Verify release archive excludes original media
        shell: powershell
        run: ./scripts/verify-package.ps1 -ArchivePath ./dist/GanzhePets-Windows-1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GanzhePets-Windows
          path: |
            dist/*.zip
            dist/*.sha256
